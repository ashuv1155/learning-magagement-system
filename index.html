<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Roadmap Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Literata:opsz,wght@7..72,400..700&display=swap" rel="stylesheet">
<!-- Firebase App, Auth and Firestore (compat mode for robust static web app support) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#EEF1EF;--surface:#FFFFFF;--surface2:#F6F8F7;--ink:#17222C;--muted:#586670;--line:#D6DCD9;
  --brand:#233F8F;--brand-ink:#FFFFFF;--ok:#1E8E5A;--warn:#B8741A;--bad:#C0392B;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 16px rgba(20,30,40,.05);
  --f-ui:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#11171C;--surface:#1A2229;--surface2:#212A32;--ink:#E5EAEE;--muted:#93A1AC;--line:#2D3841;--brand:#8FA9F5;--brand-ink:#0E1620;--ok:#4CC38A;--warn:#E3A24A;--bad:#EF7B6E;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25)}
}
:root[data-theme="dark"]{--bg:#11171C;--surface:#1A2229;--surface2:#212A32;--ink:#E5EAEE;--muted:#93A1AC;--line:#2D3841;--brand:#8FA9F5;--brand-ink:#0E1620;--ok:#4CC38A;--warn:#E3A24A;--bad:#EF7B6E;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--f-ui);margin:0;line-height:1.2;letter-spacing:-.01em}
h1{font-size:2rem;font-weight:700}h2{font-size:1.35rem;font-weight:650}h3{font-size:1.05rem;font-weight:650}
p{margin:0}
.read{font-family:var(--f-read);line-height:1.6}
.muted{color:var(--muted)}.small{font-size:.85rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.app{display:grid;grid-template-columns:268px 1fr;min-height:100vh}
.app.no-side{grid-template-columns:1fr}
.app.no-side .side{display:none!important}
.app.no-side .topbar{display:none!important}
.app.no-side .main{max-width:680px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;min-height:90vh;padding:24px 16px}
.side{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:18px 14px 24px;display:flex;flex-direction:column;gap:6px}
.brand{font-weight:700;font-size:1.1rem;padding:4px 8px 12px;display:flex;align-items:center;gap:10px}
.brand i{width:26px;height:26px;border-radius:7px;background:conic-gradient(#3E6FD9,#1F9D8A,#D9822B,#C9483F,#8A5CD1,#3F9A3F,#D1578A,#A68A1F,#3E6FD9)}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500}
.nav a:hover{background:var(--surface2)}
.nav a[aria-current="page"]{background:var(--surface2);box-shadow:inset 3px 0 0 var(--c,var(--brand));font-weight:650}
.nav .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.nav .pct{margin-left:auto;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.nav .sec{font-size:.8rem;color:var(--muted);padding:12px 10px 4px;font-weight:600}
.main{padding:28px clamp(16px,4vw,48px) 80px;max-width:1180px;width:100%}
.topbar{display:none}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.card h3{margin-bottom:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;font-weight:550;transition:background .12s}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:.85rem}
.btn.danger{color:var(--bad);border-color:var(--bad)}
input[type=text],input[type=url],input[type=date],input[type=number],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{resize:vertical;min-height:110px;line-height:1.55}
textarea.read,.read textarea{font-family:var(--f-read)}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.78rem;font-weight:600;border:1px solid var(--line);background:var(--surface2);white-space:nowrap}
.pill.s1{color:var(--warn);border-color:var(--warn)}.pill.s2{color:var(--ok);border-color:var(--ok)}
.pill.s3{background:var(--ok);color:#fff;border-color:var(--ok)}
.pill.due{color:var(--bad);border-color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c,var(--brand));border-radius:99px;transition:width .35s}
.banner{border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--surface));border-radius:10px;padding:10px 14px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* trail hero */
.hero h1{max-width:20ch}
.trail{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:22px 0 6px}
.seg{position:relative;text-decoration:none;color:var(--ink);display:block}
.seg .track{height:14px;border-radius:7px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.seg .track i{display:block;height:100%;background:var(--c);transition:width .4s}
.seg .lbl{font-size:.78rem;margin-top:6px;line-height:1.25;color:var(--muted)}
.seg .num{font-weight:700;color:var(--c);font-size:.95rem}
.seg.here::after{content:"";position:absolute;left:50%;top:-9px;width:0;height:0;border:6px solid transparent;border-top-color:var(--ink);transform:translateX(-50%)}
.seg:hover .lbl{color:var(--ink)}
.bigpct{font-size:3.4rem;font-weight:750;letter-spacing:-.03em;line-height:1}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:1.7rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);grid-auto-columns:14px;gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:14px;height:14px;border-radius:3px;background:var(--surface2);border:1px solid var(--line)}
.heat i.l1{background:color-mix(in srgb,var(--ok) 28%,var(--surface))}.heat i.l2{background:color-mix(in srgb,var(--ok) 55%,var(--surface))}.heat i.l3{background:color-mix(in srgb,var(--ok) 80%,var(--surface))}.heat i.l4{background:var(--ok)}
.mcard{display:block;text-decoration:none;color:inherit;border-top:5px solid var(--c)}
.mcard:hover{transform:translateY(-1px)}
.mcard .t{font-weight:650;font-size:1.05rem}

/* month page */
.stepper{display:flex;gap:0;overflow-x:auto;margin:14px 0 22px;padding-bottom:6px}
.step{flex:1 0 150px;padding:10px 12px;border:1px solid var(--line);background:var(--surface);margin-left:-1px}
.step:first-child{border-radius:10px 0 0 10px;margin-left:0}.step:last-child{border-radius:0 10px 10px 0}
.step .sn{font-weight:650;font-size:.88rem;line-height:1.25;min-height:2.2em}
.step .bar{margin-top:8px;height:6px}
details.topic{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
details.topic>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center;font-weight:650}
details.topic>summary::-webkit-details-marker{display:none}
details.topic>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.topic[open]>summary::before{transform:rotate(90deg)}
details.topic>summary .cnt{margin-left:auto;font-weight:500;color:var(--muted);font-size:.85rem}
.crow{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;border-top:1px solid var(--line);cursor:pointer}
.crow:hover{background:var(--surface2)}
.crow .cb{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;margin-top:1px;font-size:14px;line-height:1;color:#fff}
.crow .cb[aria-checked="true"]{background:var(--c);border-color:var(--c)}
.crow .nm{font-weight:600}
.crow .ds{font-family:var(--f-read);font-size:.88rem;color:var(--muted);line-height:1.45;margin-top:1px}
.crow .meta{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none;padding-left:8px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.85rem;color:var(--muted);font-weight:600}
.tablewrap{overflow-x:auto}
.check{display:flex;gap:10px;align-items:flex-start}
.check input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--c,var(--brand));flex:none}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--bg);z-index:41;overflow:auto;box-shadow:-8px 0 32px rgba(0,0,0,.25);padding:20px clamp(14px,3vw,28px) 60px;padding-top:calc(20px + env(safe-area-inset-top,0px));animation:slidein .18s ease-out}
@keyframes slidein{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
.drawer section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.drawer section h4{font-size:.95rem;margin-bottom:8px;font-weight:650}
.seg-btns{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--surface)}
.seg-btns button{flex:1;border:0;background:none;padding:8px 6px;font-weight:550;border-right:1px solid var(--line)}
.seg-btns button:last-child{border-right:0}
.seg-btns button[aria-pressed="true"]{background:var(--c);color:#fff}
.stars button{background:none;border:0;font-size:1.5rem;line-height:1;padding:2px;color:var(--line)}
.stars button.on{color:#E0A526}
.preview{border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--surface2);min-height:110px;font-family:var(--f-read)}
.preview h1,.preview h2,.preview h3{margin:.6em 0 .3em}.preview h1{font-size:1.3rem}.preview h2{font-size:1.15rem}.preview h3{font-size:1.02rem}
.preview p{margin:.5em 0}.preview ul{margin:.4em 0;padding-left:1.3em}
.preview code{font-family:var(--f-mono);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:.88em}
.preview pre{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto}.preview pre code{border:0;padding:0}
.math{font-family:var(--f-mono);color:var(--brand)}
.snip{border:1px solid var(--line);border-radius:8px;margin-top:8px;overflow:hidden}
.snip header{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;background:var(--surface2);font-size:.82rem}
.snip pre{margin:0;padding:10px;overflow:auto;font-family:var(--f-mono);font-size:.84rem}
.item{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}.item .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.timer{font-variant-numeric:tabular-nums;font-weight:650;font-size:1.1rem}

/* flashcards */
.fc{min-height:240px;display:grid;place-items:center;text-align:center;padding:28px;font-family:var(--f-read);font-size:1.25rem;cursor:pointer;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.fc.back{background:var(--surface2)}

/* palette */
.pal{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(620px,94vw);background:var(--surface);border:1px solid var(--line);border-radius:14px;z-index:60;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.pal input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 16px;font-size:1.05rem}
.pal ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.pal li{padding:8px 10px;border-radius:8px;cursor:pointer}
.pal li[aria-selected="true"]{background:var(--surface2)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:80;font-weight:550}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters select,.filters input{width:auto}
svg text{font-family:var(--f-ui);fill:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.menu-btn{display:none}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:50;transform:translateX(-102%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:8px 0 30px rgba(0,0,0,.3)}
  .topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
  .trail{grid-template-columns:repeat(4,1fr);row-gap:16px}
  h1{font-size:1.6rem}.bigpct{font-size:2.6rem}
  .crow .meta{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Navigation"></aside>
  <div>
    <div class="topbar"><button class="btn sm" onclick="document.getElementById('side').classList.toggle('open')" aria-label="Open menu">Menu</button><b>AI Roadmap</b><button class="btn sm" style="margin-left:auto" onclick="palette()">Search</button></div>
    <main class="main" id="main"></main>
  </div>
</div>
<div id="drawer"></div>
<script>
const ROADMAP = [
{n:1,title:"Linear Algebra for AI",short:"Linear algebra",color:"#3E6FD9",
outcome:"Build the mathematical intuition needed to understand data representations, similarity, transformations, optimization, and dimensionality reduction.",
src:["NumPy: Linear algebra (numpy.linalg)","https://numpy.org/doc/stable/reference/routines.linalg.html"],
stages:[
["Representing Data","Scalars|Vectors|Matrices|Tensors|Shape and dimensions"],
["Vector Operations","Addition and subtraction|Scalar multiplication|Dot product|Element-wise product|Linear combinations"],
["Matrix Operations and Transformations","Matrix addition and scaling|Matrix multiplication|Transpose|Identity matrix|Inverse and pseudo-inverse|Linear transformations|Systems of linear equations"],
["Vector Spaces and Geometry","Span|Linear independence|Basis|Rank|Norms|Distance|Cosine similarity|Orthogonality|Projection"],
["Decomposition and Dimensionality","Eigenvalues and eigenvectors|Singular Value Decomposition|PCA intuition|Covariance matrix"],
["Essential Supporting Mathematics","Functions and slopes|Partial derivatives|Gradient|Chain rule|Mean and variance|Probability basics"]],
topics:[
["Representing Data",[
["Scalars","Understand a scalar as a single numerical value such as a weight, loss, or learning rate."],
["Vectors","Understand a vector as an ordered list that can represent features, parameters, or embeddings."],
["Matrices","Understand a matrix as a two-dimensional arrangement used for datasets, weights, and transformations."],
["Tensors","Understand tensors as multidimensional arrays that generalize scalars, vectors, and matrices."],
["Shape and dimensions","Read array shapes correctly and identify samples, features, channels, batches, and sequence dimensions."]]],
["Vector Operations",[
["Addition and subtraction","Understand element-wise vector operations and the requirement for compatible dimensions."],
["Scalar multiplication","Understand how scaling changes a vector's magnitude while preserving or reversing its direction."],
["Dot product","Interpret the dot product as both a weighted sum and a measure related to directional alignment."],
["Element-wise product","Distinguish element-wise multiplication from a dot product or matrix multiplication."],
["Linear combinations","Understand how weighted sums of vectors construct new points, features, and model outputs."]]],
["Matrix Operations and Transformations",[
["Matrix addition and scaling","Apply element-wise matrix operations while tracking shape compatibility."],
["Matrix multiplication","Understand row-by-column multiplication, shape rules, and why order usually matters."],
["Transpose","Understand how transposition swaps axes and supports dot products, covariance, and gradient calculations."],
["Identity matrix","Recognize the identity matrix as the matrix equivalent of multiplying by one."],
["Inverse and pseudo-inverse","Understand what an inverse represents and why numerical methods often avoid computing it directly."],
["Linear transformations","See matrices as functions that rotate, scale, reflect, project, or combine coordinates."],
["Systems of linear equations","Connect matrix equations to finding unknown parameters and recognize unique, absent, or multiple solutions."]]],
["Vector Spaces and Geometry",[
["Span","Understand the set of all vectors reachable through linear combinations of given vectors."],
["Linear independence","Recognize when no vector in a set can be recreated from the others."],
["Basis","Understand a basis as a minimal independent coordinate system for a vector space."],
["Rank","Use rank to reason about independent information, redundancy, and transform dimensionality."],
["Norms","Interpret L1 and L2 norms as measures of vector size and connect them to regularization."],
["Distance","Understand Euclidean and Manhattan distance and how scale affects distance-based methods."],
["Cosine similarity","Measure orientation-based similarity between vectors, especially embeddings and documents."],
["Orthogonality","Understand perpendicular vectors, zero dot products, and independent directions."],
["Projection","Understand how a vector is mapped onto another vector or lower-dimensional subspace."]]],
["Decomposition and Dimensionality",[
["Eigenvalues and eigenvectors","Understand invariant directions and their scaling under a matrix transformation."],
["Singular Value Decomposition","Understand SVD as a factorization that exposes important directions and strengths in a matrix."],
["PCA intuition","Connect variance-maximizing directions to dimensionality reduction without deriving the full algorithm."],
["Covariance matrix","Understand how covariance records how pairs of features vary together."]]],
["Essential Supporting Mathematics",[
["Functions and slopes","Interpret a function as an input-output relationship and a derivative as local rate of change."],
["Partial derivatives","Understand how an output changes with respect to one input while other inputs are held fixed."],
["Gradient","Understand the gradient as the direction of steepest increase across many parameters."],
["Chain rule","Understand how derivatives propagate through composed operations in neural networks."],
["Mean and variance","Use mean to describe center and variance to describe spread in data or model outputs."],
["Probability basics","Understand events, conditional probability, distributions, and expected value at an intuitive level."]]]],
tools:[
["NumPy arrays","Create vectors and matrices and inspect their dimensions, data types, and shapes."],
["numpy.linalg","Practice norms, matrix rank, solving linear systems, eigen decomposition, and SVD."],
["Jupyter Notebook","Use small executable examples to connect symbolic notation with numerical results."]],
checks:[
"Represent a small tabular dataset as a matrix and explain what each axis means.",
"Compute dot products, cosine similarity, rank, eigenvalues, and SVD for small NumPy arrays and interpret the outputs."]},

{n:2,title:"Machine Learning",short:"Machine learning",color:"#1F9D8A",
outcome:"Understand the complete classical ML workflow and make sound choices about data, algorithms, validation, metrics, and generalization.",
src:["scikit-learn: User Guide","https://scikit-learn.org/stable/user_guide.html"],
stages:[
["Foundations and Workflow","Artificial intelligence, ML, and deep learning|Samples, features, and targets|Supervised learning|Unsupervised learning|Problem framing|Baseline|End-to-end workflow"],
["Data Preparation and Features","Exploratory data analysis|Missing values|Categorical encoding|Feature scaling|Outliers|Feature engineering|Feature selection|Class imbalance|Data leakage|Preprocessing pipelines"],
["Regression","Regression objective|Linear regression|Polynomial features|Ridge and Lasso|Regression metrics"],
["Classification","Classification objective|Logistic regression|k-Nearest Neighbors|Naive Bayes|Decision trees|Random forests|Gradient boosting|Support Vector Machines|Decision thresholds|Classification metrics"],
["Clustering and Dimensionality Reduction","Clustering objective|K-means|Hierarchical clustering|DBSCAN|Clustering evaluation|Principal Component Analysis"],
["Generalization and Model Selection","Train, validation, and test sets|Stratified and grouped splits|Cross-validation|Overfitting|Underfitting|Bias and variance|Regularization|Hyperparameters|Grid and randomized search|Learning and validation curves|Model interpretation|Reproducibility"]],
topics:[
["Foundations and Workflow",[
["Artificial intelligence, ML, and deep learning","Distinguish the broad field, data-driven learning methods, and neural-network-based learning."],
["Samples, features, and targets","Identify rows, input variables, labels, and predictions in a dataset."],
["Supervised learning","Learn mappings from labeled inputs to targets for regression and classification."],
["Unsupervised learning","Find structure in unlabeled data through clustering, dimensionality reduction, or anomaly detection."],
["Problem framing","Translate a real question into inputs, targets, constraints, and a measurable success criterion."],
["Baseline","Establish a simple reference result before judging whether a complex model adds value."],
["End-to-end workflow","Follow problem definition, data preparation, training, validation, testing, interpretation, and iteration."]]],
["Data Preparation and Features",[
["Exploratory data analysis","Inspect distributions, missingness, class balance, correlations, unusual values, and possible leakage."],
["Missing values","Choose deletion or imputation strategies without learning information from the test set."],
["Categorical encoding","Represent categories with ordinal or one-hot encodings appropriate to their meaning."],
["Feature scaling","Use standardization or normalization when algorithm behavior depends on feature magnitude."],
["Outliers","Identify influential observations and decide whether they are errors, rare cases, or valid extremes."],
["Feature engineering","Create informative inputs from raw values using domain knowledge and reproducible transformations."],
["Feature selection","Remove irrelevant or redundant inputs while avoiding selection based on held-out test results."],
["Class imbalance","Recognize misleading accuracy and consider class weights, resampling, or threshold changes."],
["Data leakage","Prevent future, target, duplicate, or test information from entering model training."],
["Preprocessing pipelines","Bundle transformations and estimators so training and inference apply identical steps."]]],
["Regression",[
["Regression objective","Predict a continuous numerical target and measure the size and pattern of errors."],
["Linear regression","Understand the weighted linear relationship between features and a continuous outcome."],
["Polynomial features","Model simple nonlinear patterns by expanding inputs while monitoring overfitting."],
["Ridge and Lasso","Understand L2 and L1 regularization as controls on coefficient size and model complexity."],
["Regression metrics","Use MAE, MSE, RMSE, and R-squared according to error sensitivity and interpretability needs."]]],
["Classification",[
["Classification objective","Predict discrete labels and understand binary, multiclass, and multilabel settings."],
["Logistic regression","Interpret class probabilities produced from a linear decision function."],
["k-Nearest Neighbors","Predict from nearby examples and understand sensitivity to scaling and the choice of k."],
["Naive Bayes","Understand probabilistic classification under a simplifying conditional-independence assumption."],
["Decision trees","Learn rule-based splits, impurity, depth, and the tendency of unrestricted trees to overfit."],
["Random forests","Understand how bagging many randomized trees improves stability and generalization."],
["Gradient boosting","Understand sequential error correction with weak learners and controlled learning rates."],
["Support Vector Machines","Understand maximum-margin separation, kernels at an intuitive level, and scaling requirements."],
["Decision thresholds","Separate probability estimation from the threshold used to make a final class decision."],
["Classification metrics","Interpret confusion matrices, accuracy, precision, recall, F1, ROC-AUC, and PR-AUC."]]],
["Clustering and Dimensionality Reduction",[
["Clustering objective","Group similar unlabeled samples while recognizing that clusters require interpretation."],
["K-means","Understand centroid-based grouping, the choice of k, initialization, and sensitivity to scale and outliers."],
["Hierarchical clustering","Understand nested clusters, linkage choices, distance measures, and dendrogram interpretation."],
["DBSCAN","Find density-based clusters and noise without specifying a fixed number of clusters."],
["Clustering evaluation","Use inertia, silhouette score, stability, and domain usefulness without treating them as ground truth."],
["Principal Component Analysis","Reduce correlated numerical features into orthogonal components that retain substantial variance."]]],
["Generalization and Model Selection",[
["Train, validation, and test sets","Use separate data roles for fitting, choosing models, and estimating final performance."],
["Stratified and grouped splits","Preserve class ratios or keep related samples together when random splitting would mislead."],
["Cross-validation","Estimate model stability across multiple folds without repeatedly consulting the test set."],
["Overfitting","Recognize strong training performance paired with weak unseen-data performance."],
["Underfitting","Recognize when a model or feature set is too simple to capture meaningful patterns."],
["Bias and variance","Understand the tradeoff between systematic error and sensitivity to the training sample."],
["Regularization","Constrain model flexibility to improve performance on unseen data."],
["Hyperparameters","Distinguish learned parameters from configuration choices made before training."],
["Grid and randomized search","Search candidate settings within cross-validation while controlling computational cost."],
["Learning and validation curves","Diagnose data limitations, underfitting, and overfitting from performance trends."],
["Model interpretation","Use coefficients, tree importances, permutation importance, and error analysis cautiously."],
["Reproducibility","Control random seeds, preserve pipelines, record settings, and keep a final untouched test set."]]]],
tools:[
["scikit-learn","Use estimators, preprocessing, pipelines, model selection, metrics, and inspection through a consistent API."],
["Pandas and NumPy","Load, inspect, transform, and represent tabular data for modelling."],
["Matplotlib and Seaborn","Visualize data distributions, errors, confusion matrices, and validation behavior."]],
checks:[
"Compare two classification algorithms using a pipeline, cross-validation, and metrics appropriate to the class balance.",
"Explain why a deliberately leaked or overfit model appears strong and how the corrected evaluation changes the conclusion."]},

{n:3,title:"Deep Learning Foundations",short:"Deep learning basics",color:"#D9822B",
outcome:"Understand how neural networks compute predictions, learn through gradients, and are trained and evaluated in PyTorch.",
src:["PyTorch: Learn the Basics","https://docs.pytorch.org/tutorials/beginner/basics/"],
stages:[
["Neural Network Building Blocks","Perceptron and artificial neuron|Weights and biases|Layers|Multilayer perceptron|Parameters and hyperparameters|Universal approximation intuition"],
["Activation Functions","Sigmoid|Tanh|ReLU|Leaky ReLU and GELU|Softmax"],
["Forward and Backward Learning","Forward propagation|Logits and predictions|Loss function|Mean squared error|Binary cross-entropy|Multiclass cross-entropy|Computational graph|Backpropagation|Automatic differentiation|Gradient accumulation"],
["Optimization","Gradient descent|Stochastic and mini-batch gradient descent|Learning rate|Momentum|Adam|Learning-rate scheduling|Epoch, batch, and iteration"],
["Stable Training and Generalization","Parameter initialization|Vanishing and exploding gradients|Batch normalization|Layer normalization|Dropout|Weight decay|Early stopping|Training versus evaluation mode"],
["PyTorch Workflow","Tensors|Dataset and DataLoader|nn.Module|Training loop|Validation loop|Saving and loading|Inference|CPU and GPU execution"]],
topics:[
["Neural Network Building Blocks",[
["Perceptron and artificial neuron","Understand the weighted sum, bias, activation, and output of a basic neuron."],
["Weights and biases","Recognize trainable parameters that control feature influence and activation thresholds."],
["Layers","Distinguish input, hidden, and output layers and track tensor shapes between them."],
["Multilayer perceptron","Understand how stacked dense layers learn nonlinear relationships."],
["Parameters and hyperparameters","Separate learned weights from architecture and training choices."],
["Universal approximation intuition","Understand why sufficient nonlinear networks can represent complex functions without treating this as a guarantee of learning."]]],
["Activation Functions",[
["Sigmoid","Understand bounded outputs, probability-like interpretation, and saturation-related gradient problems."],
["Tanh","Understand zero-centered bounded activation and its remaining saturation limitations."],
["ReLU","Understand sparse positive activation, efficient gradients, and the dead-neuron risk."],
["Leaky ReLU and GELU","Recognize alternatives that preserve some negative signal or provide smoother gating."],
["Softmax","Convert output logits into a normalized distribution over mutually exclusive classes."]]],
["Forward and Backward Learning",[
["Forward propagation","Trace inputs through layer operations to obtain predictions."],
["Logits and predictions","Distinguish raw model scores from probabilities and final decisions."],
["Loss function","Understand loss as a differentiable training objective that measures prediction error."],
["Mean squared error","Use squared error for suitable regression problems and understand its sensitivity to large errors."],
["Binary cross-entropy","Use log loss for binary probabilities with the correct output representation."],
["Multiclass cross-entropy","Train class logits against mutually exclusive labels without applying redundant softmax operations."],
["Computational graph","View a prediction as connected tensor operations whose dependencies are tracked for differentiation."],
["Backpropagation","Understand how the chain rule distributes output error backward through network parameters."],
["Automatic differentiation","Use PyTorch autograd to compute gradients while understanding what requires gradient tracking."],
["Gradient accumulation","Understand why gradients must normally be cleared between optimization steps."]]],
["Optimization",[
["Gradient descent","Update parameters in the direction that reduces the loss."],
["Stochastic and mini-batch gradient descent","Trade exact full-dataset gradients for efficient noisy updates from smaller batches."],
["Learning rate","Recognize how step size affects speed, stability, divergence, and convergence."],
["Momentum","Use accumulated gradient direction to smooth updates and accelerate consistent movement."],
["Adam","Understand adaptive per-parameter learning rates and why Adam is a common practical default."],
["Learning-rate scheduling","Adjust the learning rate during training to improve convergence."],
["Epoch, batch, and iteration","Distinguish a full pass over data, a sample group, and a single parameter update."]]],
["Stable Training and Generalization",[
["Parameter initialization","Initialize weights to preserve useful signal and gradient scales through layers."],
["Vanishing and exploding gradients","Recognize unstable gradient magnitudes that prevent effective deep-network learning."],
["Batch normalization","Understand normalization of intermediate activations and its effect on optimization."],
["Layer normalization","Understand feature-wise normalization commonly used in sequence and Transformer models."],
["Dropout","Randomly disable activations during training to reduce co-adaptation and overfitting."],
["Weight decay","Penalize large weights as a practical form of L2-style regularization."],
["Early stopping","Stop training when validation performance no longer improves."],
["Training versus evaluation mode","Switch behaviors such as dropout and normalization correctly between fitting and inference."]]],
["PyTorch Workflow",[
["Tensors","Create, reshape, index, broadcast, and move tensors while tracking dtype and device."],
["Dataset and DataLoader","Separate sample access from batching, shuffling, and parallel data delivery."],
["nn.Module","Define reusable trainable models with registered parameters and a forward method."],
["Training loop","Implement zero-gradient, forward, loss, backward, optimizer-step, and metric-tracking stages."],
["Validation loop","Measure generalization without updating weights or storing unnecessary gradients."],
["Saving and loading","Persist model parameters and restore them with a matching architecture."],
["Inference","Prepare inputs, use evaluation mode, disable gradients, and decode model outputs."],
["CPU and GPU execution","Understand device placement and use acceleration when available without making it a prerequisite."]]]],
tools:[
["PyTorch","Build models, track computations, calculate gradients, optimize parameters, and run inference."],
["Torchmetrics or scikit-learn metrics","Evaluate predictions separately from the optimization loss."],
["TensorBoard","Optionally inspect training and validation curves to diagnose model behavior."]],
checks:[
"Manually trace one forward pass and identify where every tensor shape changes.",
"Write a small PyTorch training loop and explain the purpose of every operation in the optimization cycle."]},

{n:4,title:"Deep Learning Architectures and Transformers",short:"Architectures & Transformers",color:"#C9483F",
outcome:"Understand how architectures exploit spatial, sequential, and contextual structure, culminating in the Transformer.",
src:["Hugging Face: The LLM Course","https://huggingface.co/learn/llm-course/chapter1/1"],
stages:[
["Convolutional Neural Networks","Spatial structure|Convolution|Kernel, stride, and padding|Feature maps and channels|Pooling|Receptive field|CNN hierarchy|Image augmentation"],
["Recurrent Sequence Models","Sequence representation|Recurrent neural network|Hidden state|Backpropagation through time|Vanishing gradients in sequences|LSTM|GRU|Bidirectional recurrence"],
["Encoder–Decoder and Embeddings","Encoder–decoder pattern|Context bottleneck|Token embeddings|Embedding lookup|Embedding dimensions"],
["Attention","Attention intuition|Queries, keys, and values|Scaled dot-product attention|Self-attention|Cross-attention|Attention mask|Multi-head attention"],
["Transformer Architecture","Positional encoding|Feed-forward network|Residual connections|Layer normalization|Transformer block|Encoder-only models|Decoder-only models|Encoder–decoder Transformers|Computational tradeoffs"],
["Using Pretrained Models","Pretraining|Transfer learning|Feature extraction|Fine-tuning|Inference pipeline|Architecture selection"]],
topics:[
["Convolutional Neural Networks",[
["Spatial structure","Understand why neighboring pixels and repeated local patterns make images different from ordinary feature vectors."],
["Convolution","Apply learnable filters across local regions with shared weights."],
["Kernel, stride, and padding","Understand how filter size, movement, and border handling determine output shape and receptive field."],
["Feature maps and channels","Track how filters convert input channels into learned activation maps."],
["Pooling","Summarize local regions to reduce spatial resolution and add limited translation robustness."],
["Receptive field","Understand which input region can influence a deeper activation."],
["CNN hierarchy","Recognize progression from simple edges and textures to task-specific patterns."],
["Image augmentation","Use label-preserving transformations to improve robustness and reduce overfitting."]]],
["Recurrent Sequence Models",[
["Sequence representation","Represent ordered tokens or time steps while preserving position and variable length."],
["Recurrent neural network","Reuse a transition function across time while carrying a hidden state."],
["Hidden state","Interpret the recurrent state as a compressed summary of preceding sequence information."],
["Backpropagation through time","Understand how recurrent computations are unrolled so gradients pass across time steps."],
["Vanishing gradients in sequences","Recognize why long-range dependencies are difficult for basic RNNs."],
["LSTM","Understand input, forget, and output gates as mechanisms for controlling long-term information flow."],
["GRU","Understand a simpler gated recurrent alternative that combines parts of LSTM behavior."],
["Bidirectional recurrence","Combine left-to-right and right-to-left context when the full sequence is available."]]],
["Encoder–Decoder and Embeddings",[
["Encoder–decoder pattern","Map an input sequence into an internal representation and decode it into an output sequence."],
["Context bottleneck","Understand why compressing a long input into one fixed vector loses information."],
["Token embeddings","Map discrete token IDs to dense learnable vectors that capture useful relationships."],
["Embedding lookup","Understand that embedding layers select and train rows of an embedding matrix."],
["Embedding dimensions","Recognize the tradeoff between representational capacity, memory, and computational cost."]]],
["Attention",[
["Attention intuition","Compute a weighted combination of relevant values instead of relying on one fixed context vector."],
["Queries, keys, and values","Understand queries as requests, keys as match descriptors, and values as retrievable content."],
["Scaled dot-product attention","Measure query-key similarity, scale scores, normalize them, and combine values."],
["Self-attention","Let every token build a context-aware representation from other tokens in the same sequence."],
["Cross-attention","Let one sequence attend to representations produced from another sequence."],
["Attention mask","Block padding or future positions from contributing to attention."],
["Multi-head attention","Learn several attention projections that can capture different relationships in parallel."]]],
["Transformer Architecture",[
["Positional encoding","Add order information because self-attention alone does not encode token position."],
["Feed-forward network","Apply the same nonlinear transformation independently to each token position."],
["Residual connections","Preserve information and improve gradient flow around attention and feed-forward sublayers."],
["Layer normalization","Stabilize Transformer activations within each token representation."],
["Transformer block","Combine attention, feed-forward processing, residual paths, normalization, and dropout."],
["Encoder-only models","Use bidirectional contextual representations for understanding tasks such as classification and extraction."],
["Decoder-only models","Generate tokens autoregressively using causal masking and preceding context."],
["Encoder–decoder Transformers","Encode an input and condition a decoder for tasks such as translation or summarization."],
["Computational tradeoffs","Recognize attention's parallelism, context benefits, and increasing cost for long sequences."]]],
["Using Pretrained Models","Pretraining|Transfer learning|Feature extraction|Fine-tuning|Inference pipeline|Architecture selection"]],

{n:5,title:"Natural Language Processing",short:"NLP",color:"#8A5CD1",
outcome:"Connect traditional text representations and linguistic processing to modern Transformer and LLM workflows.",
src:["Hugging Face: The LLM Course","https://huggingface.co/learn/llm-course/chapter1/1"],
stages:[
["Text and Linguistic Foundations","Corpus and document|Tokens and vocabulary|Sentence segmentation|Tokenization|Normalization|Stemming|Lemmatization|Stop words|Part-of-speech tagging|Named-entity recognition|Dependency parsing"],
["Traditional Text Representations","Bag of words|N-grams|TF-IDF|Sparse matrices|Feature hashing"],
["Traditional NLP Tasks and Models","Text classification|Sentiment analysis|Topic modelling|Sequence labelling|Language modelling|Text evaluation"],
["Dense and Contextual Representations","Word2Vec|GloVe|Embedding similarity|Static embedding limitation|Contextual embeddings|Sentence and document embeddings"],
["Tokenization for Transformers","Subword tokenization|Byte-Pair Encoding|WordPiece|Special tokens|Attention masks|Token IDs and decoding"],
["Transformer Models and Tasks","Masked-language modelling|Causal-language modelling|BERT-style models|GPT-style models|Encoder–decoder models|Sequence classification|Token classification|Question answering|Summarization|Fine-tuning versus prompting"],
["LLM Fundamentals","Context window|Prompt roles|Zero-shot and few-shot prompting|Generation parameters|Hallucination|LLM evaluation|Responsible NLP"]],
topics:[
["Text and Linguistic Foundations",[
["Corpus and document","Distinguish a text collection from its individual records and preserve meaningful metadata."],
["Tokens and vocabulary","Understand tokens as model input units and vocabulary as the set of recognized token IDs."],
["Sentence segmentation","Split text into sentences while accounting for punctuation and domain-specific exceptions."],
["Tokenization","Split text into useful units while recognizing that tokenization choices affect every later stage."],
["Normalization","Standardize case, Unicode, punctuation, or spelling only when the task benefits from it."],
["Stemming","Reduce words with heuristic suffix removal while accepting that outputs may not be valid words."],
["Lemmatization","Map inflected words to dictionary forms using linguistic information."],
["Stop words","Remove common words only when their absence does not destroy task-relevant meaning."],
["Part-of-speech tagging","Assign grammatical categories that support parsing, extraction, and linguistic analysis."],
["Named-entity recognition","Locate and classify spans representing people, organizations, locations, dates, and domain entities."],
["Dependency parsing","Represent grammatical relationships between words to expose sentence structure."]]],
["Traditional Text Representations",[
["Bag of words","Represent documents with token counts while ignoring order and most context."],
["N-grams","Preserve short local word or character sequences to capture limited order and phrases."],
["TF-IDF","Weight terms by document frequency so locally important but globally common words contribute less."],
["Sparse matrices","Store high-dimensional text features efficiently when most entries are zero."],
["Feature hashing","Map tokens to fixed-size features without maintaining a full vocabulary, accepting possible collisions."]]],
["Traditional NLP Tasks and Models",[
["Text classification","Assign document labels using features such as TF-IDF with linear or probabilistic classifiers."],
["Sentiment analysis","Predict opinion polarity while recognizing context, negation, sarcasm, and domain dependence."],
["Topic modelling","Discover recurring word distributions with methods such as LDA and interpret topics cautiously."],
["Sequence labelling","Assign a label to each token for tasks such as NER or part-of-speech tagging."],
["Language modelling","Estimate token-sequence probabilities or predict missing and future tokens."],
["Text evaluation","Choose metrics based on the task and complement automated scores with error analysis."]]],
["Dense and Contextual Representations",[
["Word2Vec","Learn word vectors from local context using predictive objectives such as CBOW or skip-gram."],
["GloVe","Learn word vectors from global word co-occurrence statistics."],
["Embedding similarity","Use cosine similarity to compare directions while checking whether semantic closeness matches the task."],
["Static embedding limitation","Recognize that one vector per word cannot represent different meanings in different contexts."],
["Contextual embeddings","Represent the same token differently according to its surrounding text."],
["Sentence and document embeddings","Compress longer text into dense vectors for similarity, retrieval, clustering, and classification."]]],
["Tokenization for Transformers",[
["Subword tokenization","Balance word-level meaning with coverage of rare and unseen words."],
["Byte-Pair Encoding","Build subword units by repeatedly merging frequent symbol pairs."],
["WordPiece","Construct subword vocabularies that can compose frequent and rare word forms."],
["Special tokens","Understand task and boundary markers such as beginning, end, classification, separator, padding, and mask tokens."],
["Attention masks","Tell a model which token positions are meaningful and which are padding or prohibited context."],
["Token IDs and decoding","Convert text to model IDs and generated IDs back to readable text consistently."]]],
["Transformer Models and Tasks",[
["Masked-language modelling","Train a model to reconstruct hidden tokens using bidirectional context."],
["Causal-language modelling","Train a model to predict the next token from preceding tokens."],
["BERT-style models","Use encoder-only contextual representations for classification and token-level understanding tasks."],
["GPT-style models","Use decoder-only autoregressive models for conditional text generation."],
["Encoder–decoder models","Use sequence-to-sequence Transformers for transformation tasks such as summarization and translation."],
["Sequence classification","Attach a classifier to an encoded sequence representation for document-level labels."],
["Token classification","Predict a label for each token while aligning subword tokens with original text labels."],
["Question answering","Distinguish extractive span selection from generative answering."],
["Summarization","Condense source text while preserving key facts and checking unsupported claims."],
["Fine-tuning versus prompting","Choose between updating model parameters and guiding a frozen model with instructions or examples."]]],
["LLM Fundamentals",[
["Context window","Understand the token budget shared by instructions, inputs, retrieved context, history, and outputs."],
["Prompt roles","Separate system-level guidance, user requests, assistant messages, and tool results where the model API supports them."],
["Zero-shot and few-shot prompting","Guide behavior with instructions alone or with a small number of representative examples."],
["Generation parameters","Understand how temperature, top-p, maximum tokens, and stopping rules influence output."],
["Hallucination","Recognize fluent unsupported output and use grounding, verification, and abstention to reduce its impact."],
["LLM evaluation","Evaluate task success, factual grounding, consistency, safety, latency, and cost rather than relying on one score."],
["Responsible NLP","Check privacy, bias, harmful content, licensing, and human-impact risks throughout data and model use."]]]],
tools:[
["NLTK","Explore classic tokenization, stemming, corpora, and introductory NLP utilities."],
["spaCy","Build practical pipelines for tokenization, lemmatization, POS tagging, parsing, and NER."],
["scikit-learn","Create sparse text pipelines and classical classification or clustering baselines."],
["Hugging Face Transformers and Datasets","Use tokenizers, pretrained models, pipelines, datasets, and task-specific inference."]],
checks:[
"Compare TF-IDF and contextual embeddings for the same set of short documents and explain their different notions of similarity.",
"Run two pretrained NLP tasks and trace text through tokenization, model inference, and output decoding."]},

{n:6,title:"LangChain",short:"LangChain & RAG",color:"#3F9A3F",
outcome:"Learn the components and data flow used to build grounded, observable LLM applications with models, prompts, tools, retrieval, and agents.",
src:["LangChain Overview","https://docs.langchain.com/oss/python/langchain/overview"],
stages:[
["Models, Messages, and Prompts","Provider integration|Hosted versus local models|Chat model interface|Messages and roles|Prompt templates|Prompt variables|Model parameters"],
["Outputs and Composition","Model response|Structured output|Output parsing|Runnables|Chains|Branching and fallback|Streaming"],
["Tools and Agents","Tool|Tool calling|Tool schema quality|Agent loop|Agent state|Stopping conditions|Deterministic versus agentic workflow|Tool error handling"],
["Documents and Retrieval","Document object|Document loader|Text splitting|Chunk size and overlap|Embedding model|Vector store|Retriever|Metadata filtering|Retrieval quality"],
["Retrieval-Augmented Generation","RAG purpose|Indexing flow|Query flow|Similarity search|Top-k and context selection|Grounded answer|RAG failure modes|RAG evaluation"],
["Context, Observability, and Safety","Conversation history|Short-term context|Tracing|Evaluation datasets|Prompt injection|Tool authorization|Secrets and sensitive data"]],
topics:[
["Models, Messages, and Prompts",[
["Provider integration","Understand that provider packages connect LangChain's common interface to hosted or local model APIs."],
["Hosted versus local models","Compare setup, privacy, capability, hardware, latency, and cost without assuming one universal choice."],
["Chat model interface","Invoke, batch, and stream models through a consistent message-oriented API."],
["Messages and roles","Represent system guidance, human input, assistant output, and tool results as structured messages."],
["Prompt templates","Parameterize repeatable instructions and inputs instead of assembling fragile strings throughout the application."],
["Prompt variables","Validate and substitute dynamic values while keeping instructions and untrusted content distinguishable."],
["Model parameters","Configure output length, randomness, timeouts, retries, and provider-specific capabilities intentionally."]]],
["Outputs and Composition",[
["Model response","Inspect content, metadata, usage, tool calls, and finish reasons where the provider exposes them."],
["Structured output","Constrain responses to a schema when downstream code needs dependable fields."],
["Output parsing","Convert model text or structured responses into application-ready types and handle parse failures."],
["Runnables","Understand the common invocation and composition interface used across LangChain components."],
["Chains","Compose prompts, models, parsers, retrievers, and functions into deterministic multi-step data flows."],
["Branching and fallback","Route inputs or retry alternative models when a primary path is inappropriate or unavailable."],
["Streaming","Deliver partial output or intermediate events while handling cancellation and incomplete results."]]],
["Tools and Agents",[
["Tool","Define a callable capability with a clear name, description, input schema, and controlled output."],
["Tool calling","Let a compatible model request a function call while application code executes and returns the result."],
["Tool schema quality","Use precise types and descriptions because the model depends on them to select and call tools correctly."],
["Agent loop","Understand repeated model selection, tool execution, observation, and stopping."],
["Agent state","Track messages and application context needed across steps of an agent run."],
["Stopping conditions","Bound iterations, time, tokens, and tool use so agents cannot loop indefinitely."],
["Deterministic versus agentic workflow","Use fixed chains for predictable steps and agents only where dynamic decisions add value."],
["Tool error handling","Return useful failures, distinguish retryable errors, and prevent raw exceptions from controlling model behavior."]]],
["Documents and Retrieval",[
["Document object","Represent page content together with metadata used for filtering, attribution, and traceability."],
["Document loader","Convert files or data sources into consistent document objects while respecting source permissions."],
["Text splitting","Break long documents into retrievable units that preserve enough context without exceeding model limits."],
["Chunk size and overlap","Balance semantic completeness, retrieval precision, duplication, and context-window use."],
["Embedding model","Convert queries and chunks into vectors within the same semantic representation space."],
["Vector store","Persist embeddings and metadata and support similarity search."],
["Retriever","Expose a consistent interface that returns context relevant to a query."],
["Metadata filtering","Restrict retrieval by source, user, date, category, or authorization attributes."],
["Retrieval quality","Assess whether returned chunks are relevant, sufficient, diverse, and correctly ranked."]]],
["Retrieval-Augmented Generation",[
["RAG purpose","Ground model output in selected external knowledge without retraining the base model."],
["Indexing flow","Load, clean, split, embed, and store documents with traceable metadata."],
["Query flow","Transform a user question, retrieve context, construct a grounded prompt, generate an answer, and cite sources."],
["Similarity search","Retrieve chunks whose vector representations are close to the query embedding."],
["Top-k and context selection","Choose enough evidence for coverage without flooding the context with weak or redundant chunks."],
["Grounded answer","Require the model to rely on supplied evidence and state when evidence is insufficient."],
["RAG failure modes","Recognize ingestion, chunking, retrieval, ranking, prompt, generation, and citation failures separately."],

/* ===== helpers ===== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const fmt=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pd=s=>new Date(s+"T00:00:00");
const today=()=>fmt(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return fmt(d)};
const diffDays=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const hm=sec=>{sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);return h?h+"h "+m+"m":m?m+"m":sec+"s"};
const nice=s=>s?pd(s).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}):"—";
const STAT=["Not started","Learning","Understood","Mastered"];
const INT=[1,3,7,14,30];

/* ===== build flat index ===== */
const ALL=[],BY={};
ROADMAP.forEach(m=>{
  const stageOf={};
  m.stages.forEach((s,i)=>s[1].split("|").forEach(n=>stageOf[n.toLowerCase()]=i));
  m.cs=[];
  m.topics.forEach((t,ti)=>t[1].forEach(([name,learn])=>{
    const c={id:`m${m.n}-t${ti+1}-${slug(name)}`,name,learn,m:m.n,t:ti,topic:t[0],stage:stageOf[name.toLowerCase()]};
    ALL.push(c);BY[c.id]=c;m.cs.push(c);
  }));
});
const MON=n=>ROADMAP[n-1];

/* ===== state ===== */
const KEY="airt.v1";
let mem=null;
function blank(){return{v:1,c:{},ck:{},tl:{},sk:{},py:{done:false,notes:""},log:{},time:{},ev:[],set:{start:today(),goal:15,theme:"auto",lock:false,lastBackup:null,firstUse:today(),last:null},fin:{}}}
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);return Object.assign(blank(),o,{set:Object.assign(blank().set,o.set||{})})}}catch(e){}
  return mem||blank();
}
let S=load();
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const dflt=()=>({st:0,conf:0,notes:"",own:"",res:[],sn:[],cards:[],time:0,rev:null,due:null,step:-1,doneAt:null});
const R_=id=>S.c[id]||dflt();
const W=id=>S.c[id]||(S.c[id]=dflt());
const done=id=>R_(id).st>=2;
function bump(){const d=today();S.log[d]=(S.log[d]||0)+1}
function ev(txt,id){S.ev.unshift({t:new Date().toISOString(),txt,id});if(S.ev.length>150)S.ev.length=150}
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;e.setAttribute("role","status");document.body.appendChild(e);setTimeout(()=>e.remove(),1900)}

/* ===== computed ===== */
function mprog(n){const cs=MON(n).cs;const d=cs.filter(c=>done(c.id)).length;return{d,t:cs.length,p:cs.length?d/cs.length:0}}
function oprog(){const d=ALL.filter(c=>done(c.id)).length;return{d,t:ALL.length,p:d/ALL.length}}
function dueList(){const t=today();return ALL.filter(c=>{const r=R_(c.id);return r.st>=2&&r.due&&r.due<=t})}
function dueCards(){const t=today(),out=[];ALL.forEach(c=>R_(c.id).cards.forEach((k,i)=>{if(!k.due||k.due<=t)out.push({id:c.id,i,k})}));return out}
function streak(){let d=today(),n=0;if(!S.log[d])d=addDays(d,-1);while(S.log[d]){n++;d=addDays(d,-1)}return n}
function weekDone(){const lim=addDays(today(),-6);return ALL.filter(c=>{const r=R_(c.id);return r.st>=2&&r.doneAt&&r.doneAt>=lim}).length}
function totalTime(){return Object.values(S.time).reduce((a,b)=>a+b,0)}
function endDate(){const d=pd(S.set.start);d.setMonth(d.getMonth()+8);return fmt(d)}
function pace(){
  const s=S.set.start,e=endDate(),t=today();
  const exp=Math.max(0,Math.min(1,diffDays(s,t)/diffDays(s,e)));
  const act=oprog().p;const gap=act-exp;
  return{exp,act,label:diffDays(s,t)<0?"Not started yet":gap>=0.02?"Ahead":gap<=-0.04?"Behind":"On track",gap}
}
function firstOpen(){return ALL.find(c=>!done(c.id))}

/* ===== markdown (small, safe) ===== */
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,"<code>$1</code>");
  s=s.replace(/\$([^$\n]+)\$/g,'<span class="math">$1</span>');
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>");
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s;
}
function md(src){
  if(!src.trim())return'<p class="muted small">Nothing to preview yet.</p>';
  const L=src.split("\n");let out="",i=0,list=false;
  const close=()=>{if(list){out+="</ul>";list=false}};
  while(i<L.length){
    const l=L[i];
    if(l.startsWith("```")){close();let b=[];i++;while(i<L.length&&!L[i].startsWith("```")){b.push(L[i]);i++}i++;out+="<pre><code>"+esc(b.join("\n"))+"</code></pre>";continue}
    let m;
    if(m=l.match(/^(#{1,3})\s+(.*)/)){close();out+=`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`}
    else if(m=l.match(/^\s*[-*]\s+(.*)/)){if(!list){out+="<ul>";list=true}out+="<li>"+inline(m[1])+"</li>"}
    else if(!l.trim()){close()}
    else{close();out+="<p>"+inline(l)+"</p>"}
    i++;
  }
  close();return out;
}

/* ===== actions ===== */
let openId=null,PV=false,T=null,tick=null;
function setStatus(id,st){
  const r=W(id),was=mprog(BY[id].m).p;
  const prev=r.st;r.st=st;
  if(st>=2&&!r.doneAt){r.doneAt=today();r.step=0;r.due=addDays(today(),1)}
  if(st<2){r.doneAt=null;r.due=null;r.step=-1}
  S.set.last=id;bump();ev(`${STAT[st]}: ${BY[id].name}`,id);save();
  const now=mprog(BY[id].m).p;
  if(now===1&&was<1){confetti();toast(`Month ${BY[id].m} complete`)}
  render();if(openId===id)drawer();
}
function toggleDone(id){setStatus(id,done(id)?0:2)}
function setConf(id,n){const r=W(id);r.conf=r.conf===n?0:n;save();drawer();render()}
function fld(id,k,v){const r=W(id);r[k]=v;S.set.last=id;
  const d=today();if(r._ld!==d){r._ld=d;bump();ev(`Edited notes: ${BY[id].name}`,id)}
  clearTimeout(fld.t);fld.t=setTimeout(save,300)}
function schedule(r,grade){
  let step=Math.max(r.step,0),mult=r.conf&&r.conf<=2?0.7:r.conf>=5?1.3:1;
  if(grade===0)step=0;else if(grade===2)step=Math.min(step+1,4);else if(grade===3)step=Math.min(step+2,4);
  let days=Math.max(1,Math.round(INT[step]*mult));
  if(grade===1)days=Math.max(1,Math.round(INT[step]*0.6));
  if(grade===0)days=1;
  r.step=step;r.due=addDays(today(),days);r.rev=today();
}
function rate(id,g){const r=W(id);schedule(r,g);bump();ev(`Reviewed: ${BY[id].name}`,id);save();Rv.flip=false;Rv.idx=Math.min(Rv.idx,Math.max(0,dueList().length-1));render()}
function markRevised(id){const r=W(id);schedule(r,2);bump();ev(`Revised: ${BY[id].name}`,id);save();toast("Marked as revised");drawer();render()}
function rateCard(id,i,g){const k=W(id).cards[i];const t=today();
  let step=k.step||0;if(g===0)step=0;else if(g===2)step=Math.min(step+1,4);else if(g===3)step=Math.min(step+2,4);
  k.step=step;k.due=addDays(t,g===0?1:g===1?Math.max(1,Math.round(INT[step]*.6)):INT[step]);bump();save();Rv.flip=false;render()}
function addRes(id){const t=$("#r-title").value.trim(),u=$("#r-url").value.trim(),k=$("#r-type").value;
  if(!t||!/^https?:\/\//i.test(u)){toast("Add a title and a link starting with http");return}
  W(id).res.push({t,u,k,done:false});save();drawer()}
function delItem(id,key,i){W(id)[key].splice(i,1);save();drawer()}
function toggleRes(id,i){const x=W(id).res[i];x.done=!x.done;save();drawer()}
function addSnip(id){const c=$("#s-code").value;if(!c.trim())return;W(id).sn.push({l:$("#s-lang").value.trim()||"code",c});save();drawer()}
function addCard(id){const q=$("#c-q").value.trim(),a=$("#c-a").value.trim();if(!q||!a){toast("Write both a question and an answer");return}W(id).cards.push({q,a,due:null,step:0});save();drawer()}
function copy(txt){
  const ok=()=>toast("Copied");
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(ok,()=>fb())}else fb();
  function fb(){const t=document.createElement("textarea");t.value=txt;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();try{document.execCommand("copy");ok()}catch(e){toast("Copy failed. Select the text and copy manually.")}t.remove()}
}
function copySnip(id,i){copy(R_(id).sn[i].c)}
const PROMPTS={

function radar(vals,labels){
  const cx=260,cy=210,r=140,n=vals.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*r*v,cy+Math.sin(a)*r*v]};
  let g="";[.25,.5,.75,1].forEach(k=>{g+=`<polygon points="${vals.map((_,i)=>pt(i,k).join(",")).join(" ")}" fill="none" stroke="var(--line)"/>`});
  vals.forEach((_,i)=>{const[x,y]=pt(i,1);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;
    const[lx,ly]=pt(i,1.16);const an=lx<cx-10?"end":lx>cx+10?"start":"middle";g+=`<text x="${lx}" y="${ly+3}" font-size="10" text-anchor="${an}">${esc(labels[i])}</text>`});
  g+=`<polygon points="${vals.map((v,i)=>pt(i,Math.max(v,.02)).join(",")).join(" ")}" fill="var(--brand)" fill-opacity=".22" stroke="var(--brand)" stroke-width="2"/>`;
  return`<svg viewBox="0 0 520 420" role="img" aria-label="Skill levels radar chart" style="width:100%;max-width:560px">${g}</svg>`;
}

/* analytics */
function burnup(){
  const s=S.set.start,e=endDate(),tot=ALL.length,span=Math.max(1,diffDays(s,e)),W_=680,H=250,P=38;
  const doneDates=ALL.map(c=>R_(c.id)).filter(r=>r.st>=2&&r.doneAt).map(r=>r.doneAt).sort();
  const xs=d=>P+Math.max(0,Math.min(1,diffDays(s,d)/span))*(W_-P-12),ys=v=>H-28-(v/tot)*(H-50);
  const t=today();const days=Math.max(0,Math.min(span,diffDays(s,t)));
  let pts=[];for(let d=0;d<=days;d+=Math.max(1,Math.floor(days/80))){const ds=addDays(s,d);pts.push([xs(ds),ys(doneDates.filter(x=>x<=ds).length)])}
  const ds=addDays(s,days);pts.push([xs(ds),ys(doneDates.filter(x=>x<=ds).length)]);
  let g=[0,.25,.5,.75,1].map(k=>`<line x1="${P}" x2="${W_-12}" y1="${ys(tot*k)}" y2="${ys(tot*k)}" stroke="var(--line)"/><text x="${P-6}" y="${ys(tot*k)+3}" font-size="10" text-anchor="end">${Math.round(tot*k)}</text>`).join("");
  g+=`<line x1="${xs(s)}" y1="${ys(0)}" x2="${xs(e)}" y2="${ys(tot)}" stroke="var(--muted)" stroke-dasharray="5 4" stroke-width="2"/>`;
  g+=`<polyline fill="none" stroke="var(--brand)" stroke-width="3" points="${pts.map(p=>p.join(",")).join(" ")}"/>`;
  g+=`<text x="${P}" y="${H-8}" font-size="10">${nice(s)}</text><text x="${W_-12}" y="${H-8}" font-size="10" text-anchor="end">${nice(e)}</text>`;
  return`<svg viewBox="0 0 ${W_} ${H}" role="img" aria-label="Burn-up chart of concepts completed versus plan" style="width:100%">${g}</svg>
  <div class="legend"><span><i style="background:var(--brand)"></i>Actual</span><span><i style="background:var(--muted)"></i>Planned</span></div>`;
}
function bars(items,fmtv){
  const max=Math.max(1,...items.map(i=>i.v));
  return`<div style="display:grid;gap:8px">${items.map(i=>`<div class="row" style="flex-wrap:nowrap"><span class="small" style="width:120px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(i.l)}</span><div class="bar" style="flex:1;--c:${i.c}"><i style="width:${i.v/max*100}%"></i></div><span class="small muted" style="width:56px;text-align:right">${fmtv(i.v)}</span></div>`).join("")}</div>`;
}
function donut(){

  const cols=["var(--line)","var(--warn)","#5AA6E0","var(--ok)"];let off=0;

  return`<div class="row"><svg viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="Status distribution">${arcs}</svg><div class="legend" style="flex-direction:column">${STAT.map((s,i)=>`<span><i style="background:${cols[i]}"></i>${s}: ${cnt[i]}</span>`).join("")}</div></div>`;
}

function initFirebase(){
  const cfg = getFirebaseConfig();
  if(!cfg || !cfg.apiKey || !cfg.projectId) return;
  try {
    if(!firebase.apps.length){
      fbApp = firebase.initializeApp(cfg);
    } else {
      fbApp = firebase.app();
    }
    fbDb = firebase.firestore();
    fbConnected = true;
    console.log("Firebase Cloud Firestore connected with project:", cfg.projectId);

    // Listen to real-time student updates across all devices globally
    fbDb.collection("users").onSnapshot(snapshot => {
      if(!snapshot.empty){
        const cloudUsers = [];
        snapshot.forEach(doc => {
          cloudUsers.push(doc.data());
        });
        if(cloudUsers.length > 0){
          const local = getUsers();
          cloudUsers.forEach(cu => {
            const idx = local.findIndex(l => l.code && cu.code && l.code.toLowerCase() === cu.code.toLowerCase());
            if(idx !== -1){
              local[idx] = Object.assign({}, local[idx], cu);
            } else {
              local.push(cu);
            }
          });
          persistUsers(local, false);

          // If the logged-in user received updated progress from the cloud, sync into S.c
          const cu = currentUser();
          if(cu && cu.code){
            const myCloudRecord = cloudUsers.find(u => u.code && u.code.toLowerCase() === cu.code.toLowerCase());
            if(myCloudRecord && myCloudRecord.progress){
              S.c = Object.assign({}, S.c, myCloudRecord.progress);
              if(myCloudRecord.time) S.time = Object.assign({}, S.time, myCloudRecord.time);
              save();
            }
          }
          render();
        }
      }
    }, err => {
      console.warn("Firestore snapshot error:", err);
    });
  } catch(e){
    console.error("Firebase init failed:", e);
    fbConnected = false;
  }
}

async function loginWithGoogle(){
  const cfg = getFirebaseConfig();
  if(!firebase.apps.length){
    try {
      firebase.initializeApp(cfg);
    } catch(e){}
  }
  const auth = firebase.auth();
  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    const result = await auth.signInWithPopup(provider);
    const gUser = result.user;
    if(!gUser){return;}

    const users = getUsers();
    const email = (gUser.email || "").toLowerCase().trim();
    // Match by email or username
    let found = users.find(u => u.email && u.email.toLowerCase().trim() === email);

    // If student signs in with Google for the first time, auto-create their account!
    if(!found){
      const safeCode = (gUser.displayName || "student")
        .toLowerCase()
        .replace(/[^a-z0-9]/g, "")
        .slice(0, 15) || ("user" + Date.now().toString().slice(-4));
      
      // Ensure unique code
      let finalCode = safeCode;
      let counter = 1;
      while(users.some(u => u.code.toLowerCase() === finalCode.toLowerCase())){
        finalCode = safeCode + counter;
        counter++;
      }

      found = {
        id: "u_g_" + gUser.uid,
        name: gUser.displayName || "Google Learner",
        email: email,
        code: finalCode,
        role: (email === "ashutosh@example.com" || finalCode === "ashu") ? "Admin" : "Student",
        status: "Active",
        photo: gUser.photoURL || null,
        created: today(),
        progress: {}
      };
      users.push(found);
      persistUsers(users, true);
    }

    if(found.status === 'Inactive'){
      toast("Your account is inactive. Contact admin.");
      return;
    }

    activeUserCode = found.code;
    localStorage.setItem("airt_active_user", found.code);
    adminAuthed = (found.role === 'Admin' || found.code.toLowerCase() === 'ashu');

    // Sync progress if stored in profile
    if(found.progress && typeof found.progress === 'object' && Object.keys(found.progress).length > 0){
      S.c = Object.assign({}, S.c, found.progress);
      save();
    }

    toast(`Welcome, ${found.name}! Signed in with Google.`);
    location.hash = "#/";
    render();
  } catch(err){
    console.error("Google Auth error:", err);
    if(err.code === 'auth/popup-blocked'){
      toast("Popup blocked! Redirecting to Google...");
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        firebase.auth().signInWithRedirect(provider);
      } catch(e){}
    } else if(err.code === 'auth/popup-closed-by-user'){
      toast("Sign-in cancelled");
    } else if(err.code === 'auth/unauthorized-domain'){
      toast("Please authorize this domain in Firebase Authentication settings!");
    } else {
      toast("Google Sign-In: " + (err.message || err.code));
    }
  }
}

function checkGoogleRedirectResult(){

    firebase.auth().getRedirectResult().then(result => {
      if(result && result.user){
        const gUser = result.user;
        const users = getUsers();
        const email = (gUser.email || "").toLowerCase().trim();
        let found = users.find(u => u.email && u.email.toLowerCase().trim() === email);
        if(!found){
          const safeCode = (gUser.displayName || "student")
            .toLowerCase()
            .replace(/[^a-z0-9]/g, "")
            .slice(0, 15) || ("user" + Date.now().toString().slice(-4));
          let finalCode = safeCode;
          let counter = 1;
          while(users.some(u => u.code.toLowerCase() === finalCode.toLowerCase())){
            finalCode = safeCode + counter;
            counter++;
          }
          found = {
            id: "u_g_" + gUser.uid,

            email: email,
            code: finalCode,
            role: (email === "ashutosh@example.com" || finalCode === "ashu") ? "Admin" : "Student",

function defaultUsers(){
  return [
    {id:"u_admin_ashu",name:"Ashutosh Temgire",email:"ashutosh@example.com",code:"ashu",role:"Admin",status:"Active",created:today(),progress:{}}
  ];

function getUsers(){
  let rawUsers = null;
  try {
    const fromStorage = localStorage.getItem(USERS_DB_KEY);
    if(fromStorage){
      rawUsers = JSON.parse(fromStorage);
    }
  } catch(e){}

  if(!rawUsers || !Array.isArray(rawUsers) || rawUsers.length === 0){
    if(S.users && Array.isArray(S.users) && S.users.length > 0){
      rawUsers = S.users;
    } else {
      rawUsers = defaultUsers();
    }
  }

  // Guarantee that admin 'ashu' is always present in users list
  const hasAshu = rawUsers.some(u => u.code && u.code.toLowerCase().trim() === "ashu");
  if(!hasAshu){
    rawUsers.unshift({
      id:"u_admin_ashu",
      name:"Ashutosh Temgire",
      email:"ashutosh@example.com",
      code:"ashu",
      role:"Admin",
      status:"Active",
      created:today(),
      progress:{}
    });
  }

  // ensure all users have clean code and progress object
  rawUsers.forEach((u,idx)=>{
    if(!u.code){
      u.code = u.name.toLowerCase().replace(/[^a-z0-9_-]/g,"")+(idx+1);
    }
    u.code = u.code.trim();
    if(!u.progress) u.progress = {};
  });

  S.users = rawUsers;
  try {
    localStorage.setItem(USERS_DB_KEY, JSON.stringify(rawUsers));
  } catch(e){}
  return rawUsers;
}

function persistUsers(usersList, syncToCloud = true){
  S.users = usersList;
  try {
    localStorage.setItem(USERS_DB_KEY, JSON.stringify(usersList));
  } catch(e){}
  save();

  // Sync to Firebase Cloud if connected
  if(syncToCloud && fbDb){
    usersList.forEach(u => {
      fbDb.collection("users").doc(u.code.toLowerCase()).set(u, { merge: true })
        .catch(err => console.warn("Cloud sync failed for", u.code, err));
    });
  }
}

// Generate a secure invite payload for sharing directly with students
function generateInviteLink(user){
  const payload = {
    id: user.id,
    name: user.name,
    email: user.email,
    code: user.code,
    role: user.role || 'Student',
    status: user.status || 'Active'
  };
  const token = btoa(encodeURIComponent(JSON.stringify(payload)));
  const base = location.origin + location.pathname;
  return `${base}#/login?invite=${token}`;
}

function checkUrlInviteAndAutoLogin(){
  try {
    const hash = location.hash;
    const search = location.search;
    let token = null;

    if(hash.includes("invite=")){
      token = hash.split("invite=")[1].split("&")[0];
    } else if(search.includes("invite=")){
      const params = new URLSearchParams(search);
      token = params.get("invite");
    }

    if(token){
      const decoded = decodeURIComponent(atob(token));
      const invited = JSON.parse(decoded);
      if(invited && invited.code){
        const users = getUsers();
        const existing = users.find(u => u.code.toLowerCase() === invited.code.toLowerCase());
        if(!existing){
          users.push({
            id: invited.id || "u_" + Date.now(),
            name: invited.name || "Student",
            email: invited.email || "",
            code: invited.code,
            role: invited.role || "Student",
            status: "Active",
            created: today(),
            progress: {}
          });
          persistUsers(users);
        }
        // Auto-fill and log the student in
        activeUserCode = invited.code;
        localStorage.setItem("airt_active_user", invited.code);
        toast(`Welcome to your roadmap, ${invited.name}!`);
        // Clean URL
        history.replaceState(null, "", location.pathname + "#/");
        return true;
      }
    }
  } catch(e){
    console.error("Invite token error:", e);
  }
  return false;
}

function copyInviteLink(userId){
  const users = getUsers();
  const target = users.find(u => u.id === userId);
  if(!target){toast("User not found");return;}
  const link = generateInviteLink(target);

function loginUser(e){
  e&&e.preventDefault();
  const inputEl=$("#userCodeInput");
  const rawInput=inputEl?inputEl.value:"";
  const clean=rawInput.trim().toLowerCase();
  if(!clean){toast("Please enter your nickname / passcode");return}

  const users=getUsers();
  // Match by code/passcode, exact full name, or email address
  let found=users.find(u=>
    (u.code && u.code.trim().toLowerCase()===clean) ||
    (u.name && u.name.trim().toLowerCase()===clean) ||
    (u.email && u.email.trim().toLowerCase()===clean)
  );

  // Fallback: If username is "ashu", always ensure admin login succeeds
  if(!found && clean==="ashu"){
    found={
      id:"u_admin_ashu",
      name:"Ashutosh Temgire",
      email:"ashutosh@example.com",
      code:"ashu",
      role:"Admin",
      status:"Active",
      created:today(),
      progress:{}
    };
    if(!S.users) S.users=[];
    S.users.unshift(found);
    persistUsers(S.users);
  }

  if(found){
    if(found.status==='Inactive'){
      toast("Your account is currently inactive. Contact admin.");
      return;
    }
    activeUserCode=found.code;
    localStorage.setItem("airt_active_user",found.code);
    
    // Automatically authorize admin when admin logs in
    if(found.role==='Admin' || (found.code && found.code.toLowerCase()==='ashu')){
      adminAuthed=true;
    } else {
      adminAuthed=false;
    }

    // Sync user progress into active state if present
    if(found.progress&&typeof found.progress==='object'&&Object.keys(found.progress).length>0){
      S.c=Object.assign({},S.c,found.progress);
      save();
    }

    toast(`Welcome back, ${found.name}!`);
    location.hash="#/";
    render();
  } else {
    toast("Invalid username / passcode!");
  }
}

      const cleaned = raw
        .replace(/const firebaseConfig =/g, "")
        .replace(/;/g, "")

  <h2 style="margin:28px 0 14px">All Registered Users & Learning Reports (${users.length})</h2>

                <button class="btn sm" onclick="editUser('${u.id}')">Edit</button>
