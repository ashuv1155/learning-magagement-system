}

/* ===== Student Leaderboard View ===== */
function leaderboardView(){
  const allUsers=getUsers();
  const cu=currentUser();

  // Exclude Admin from student rankings
  const users = allUsers.filter(u => u.role !== 'Admin' && u.code.toLowerCase() !== 'ashu');

  // compute statistics for each registered student
  const ranked = users.map(u=>{
    const p = u.progress || {};
    const doneCount = ALL.filter(c => p[c.id] && p[c.id].st >= 2).length;
    const pct = ALL.length ? Math.round((doneCount / ALL.length) * 100) : 0;
    const notesCount = ALL.filter(c => p[c.id] && p[c.id].notes && p[c.id].notes.trim().length > 0).length;
    const cardsCount = ALL.reduce((acc, c) => acc + ((p[c.id] && p[c.id].cards) ? p[c.id].cards.length : 0), 0);
    const totalTimeSec = ALL.reduce((acc, c) => acc + ((p[c.id] && p[c.id].time) ? p[c.id].time : 0), 0);

    return {
      ...u,
      doneCount,
      pct,
      notesCount,
      cardsCount,
      totalTimeSec
    };
  }).sort((a,b) => {
    if(b.pct !== a.pct) return b.pct - a.pct;
    if(b.notesCount !== a.notesCount) return b.notesCount - a.notesCount;
    return b.cardsCount - a.cardsCount;
  });

  const medals = ["🥇","🥈","🥉"];
  const myRankIndex = cu ? ranked.findIndex(u=>u.code.toLowerCase()===cu.code.toLowerCase()) : -1;

  return `
  <div class="row spread" style="margin-bottom:16px">
    <div>
      <h1>Student Leaderboard 🏆</h1>
      <p class="muted small">Real-time ranking based on completed roadmap concepts, study time, and active note-taking.</p>
    </div>
  </div>

  <div class="grid g3" style="margin-bottom:20px">
    <div class="card stat"><span class="muted small">Total Active Students</span><b>${users.length}</b></div>
    <div class="card stat"><span class="muted small">Top Completion Rate</span><b>${ranked.length ? ranked[0].pct : 0}%</b></div>
    <div class="card stat"><span class="muted small">Your Rank</span><b>${myRankIndex !== -1 ? '#' + (myRankIndex + 1) : (cu && cu.role === 'Admin' ? 'Admin (Exempt)' : '—')}</b></div>
  </div>

  <div class="card">
    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            <th style="width:50px">Rank</th>
            <th>Student / User</th>
            <th>Role</th>
            <th>Concepts Completed</th>
            <th>Progress Bar</th>
            <th>Notes & Cards</th>
            <th style="text-align:right">Time Studied</th>
          </tr>
        </thead>
        <tbody>
          ${ranked.map((u, i) => {
            const isMe = cu && u.code.toLowerCase() === cu.code.toLowerCase();
            const rankLabel = i < 3 ? medals[i] : `#${i + 1}`;
            return `
            <tr style="${isMe ? 'background:var(--surface2);font-weight:600' : ''}">
              <td style="font-size:1.2rem;text-align:center">${rankLabel}</td>
              <td>
                <b>${esc(u.name)}</b> ${isMe ? '<span class="pill s2">You</span>' : ''}
                <div class="small muted">Code: <code>${esc(u.code)}</code></div>
              </td>
              <td><span class="pill ${u.role==='Admin'?'s3':u.role==='Instructor'?'s1':''}">${esc(u.role)}</span></td>
              <td><b>${u.doneCount}</b> / ${ALL.length} concepts (${u.pct}%)</td>
              <td style="min-width:140px">
                <div class="bar" style="height:8px;margin-top:6px"><i style="width:${u.pct}%"></i></div>
              </td>
              <td class="small">
                📝 ${u.notesCount} notes · 🎴 ${u.cardsCount} cards
              </td>
              <td style="text-align:right" class="small muted">${hm(u.totalTimeSec)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

/* palette */
let PAL=null;
function palette(){
  if(PAL){closePal();return}
  const d=document.createElement("div");d.id="palwrap";
  d.innerHTML=`<div class="scrim" style="z-index:59" onclick="closePal()"></div><div class="pal" role="dialog" aria-label="Search"><input id="pq" type="text" placeholder="Search concepts, descriptions, and your notes" autocomplete="off"><ul id="pr" role="listbox"></ul></div>`;
  document.body.appendChild(d);PAL={sel:0,res:[]};
  const q=$("#pq");q.focus();q.addEventListener("input",palSearch);
  q.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"){PAL.sel=Math.min(PAL.sel+1,PAL.res.length-1);palDraw();e.preventDefault()}
    else if(e.key==="ArrowUp"){PAL.sel=Math.max(PAL.sel-1,0);palDraw();e.preventDefault()}
    else if(e.key==="Enter"){const r=PAL.res[PAL.sel];if(r){closePal();openC(r.id)}}
  });palSearch();
}
function closePal(){const e=$("#palwrap");if(e)e.remove();PAL=null}
function palSearch(){
  const q=$("#pq").value.toLowerCase().trim();
  PAL.res=(q?ALL.filter(c=>{const r=R_(c.id);return c.name.toLowerCase().includes(q)||c.learn.toLowerCase().includes(q)||r.notes.toLowerCase().includes(q)||r.own.toLowerCase().includes(q)}):ALL.filter(c=>R_(c.id).due&&R_(c.id).due<=today()&&R_(c.id).st>=2)).slice(0,30);
  PAL.sel=0;palDraw();
}
function palDraw(){
  $("#pr").innerHTML=PAL.res.length?PAL.res.map((c,i)=>`<li role="option" aria-selected="${i===PAL.sel}" onclick="closePal();openC('${c.id}')"><b>${esc(c.name)}</b> <span class="small muted">Month ${c.m} · ${esc(c.topic)}</span></li>`).join(""):`<li class="muted small">${$("#pq").value?"No matches. Try a different word.":"Type to search. Concepts due for review show here."}</li>`;
}

/* ===== render + boot ===== */
function render(){
  const r=route(),host=$("#main");let h="";
  const cu=currentUser();
  const appEl=$(".app");
  
  if(!cu){
    h=loginView();
    if(appEl) appEl.classList.add("no-side");
  } else {
    if(appEl) appEl.classList.remove("no-side");
    if(r.p==="home")h=homeView();
    else if(r.p==="month")h=monthView(r.n);
    else if(r.p==="python")h=pythonView();
    else if(r.p==="revision")h=revisionView();
    else if(r.p==="skills")h=skillsView();
    else if(r.p==="analytics")h=analyticsView();
    else if(r.p==="leaderboard")h=leaderboardView();
    else if(r.p==="admin")h=adminView();
    else if(r.p==="login")h=loginView();
    else h=dataView();
  }

  const sy=window.scrollY;const open=[...document.querySelectorAll("details.topic")].map(d=>d.open);
  host.innerHTML=h;
  if(r.p==="month"&&open.length&&host.dataset.r===location.hash){document.querySelectorAll("details.topic").forEach((d,i)=>{if(open[i]!==undefined)d.open=open[i]})}
  host.dataset.r=location.hash;
  saveActiveUserProgress();
  if(cu){
    sidebar();
  }
}
window.addEventListener("hashchange",()=>{$("#side").classList.remove("open");window.scrollTo(0,0);Rv.idx=0;Rv.flip=false;resetStep=0;render()});
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();palette();return}
  if(e.key==="Escape"){if(PAL)closePal();else if(openId)closeC();return}
  const tg=e.target.tagName;if(["INPUT","TEXTAREA","SELECT"].includes(tg)||e.metaKey||e.ctrlKey||e.altKey)return;
  if(openId){
    if(e.key==="j"){nav(1)}else if(e.key==="k"){nav(-1)}
    else if(e.key===" "){e.preventDefault();toggleDone(openId)}
    else if(e.key==="n"){e.preventDefault();if(PV){PV=false;drawer()}const t=$("#notes");if(t)t.focus()}
    return;
  }
  const r=route();
  if(r.p==="revision"){
    if(e.key===" "){e.preventDefault();Rv.flip=!Rv.flip;render()}
    else if("1234".includes(e.key)&&Rv.flip){const g=+e.key-1;
      if(Rv.tab==="concepts"){const d=dueList();if(d.length)rate(d[Math.min(Rv.idx,d.length-1)].id,g)}
      else{const d=dueCards();if(d.length){const x=d[Math.min(Rv.idx,d.length-1)];rateCard(x.id,x.i,g)}}}
  }
});
window.addEventListener("storage",e=>{
  if(e.key===USERS_DB_KEY || e.key===KEY){
    S = load();
    getUsers();
    render();
  }
});
window.addEventListener("beforeunload",timerStop);
applyTheme();
initFirebase();
checkGoogleRedirectResult();
checkUrlInviteAndAutoLogin();
render();
</script></body></html>
